# Blade CI.
#
# The test lanes run on GitHub-hosted Windows runners, because Windows is the
# primary development platform here and the one the whole native toolchain
# story is written against (MSYS2 ucrt64 g++, MSYS2 clang64 clang, MS-MPI, the
# OpenBLAS prebuilt). They use the stock `windows-latest` image plus what
# .github/actions/setup-blade-toolchain installs -- no container is involved.
# The cheap default gate runs on Linux; the `build` job says why.
#
# WHAT RUNS BY DEFAULT IS DELIBERATELY SMALL. Every push and pull request gets
# the `build` job and nothing else: `dotnet build`, then the byte-pinned LLVM
# emission goldens, which take about a second and need no native toolchain at
# all. That is the whole of the default cost -- no g++, no MSYS2, no MS-MPI, no
# OpenBLAS download, no thousands of compiled corpus programs.
#
# The heavy lanes are opt-in, and there are three ways in:
#
#   * label a pull request `ci:full`
#   * run the workflow by hand (Actions -> CI -> Run workflow), where the
#     `lanes` input can pick one lane instead of all three
#   * the nightly schedule on master
#
# The first two are the BROAD opt-ins and skip the nightly-only lanes; the
# nightly runs everything, and dispatching a lane BY NAME always runs it.
#
# The lanes themselves:
#
#   cpp        NIGHTLY-ONLY. The default suite, which is the C++ back end end
#              to end, plus the OpenMP and MPI blocks that are opt-in by flag.
#              Much the longest lane, so it does not sit in front of a pull
#              request; `lanes: cpp` still runs it on demand
#   netcdf     one lane EACH, because these are reachable only as standalone
#   zarr       verbs (no combination of `blade test` flags folds them into the
#   csv        default suite) and because a hang in one must not take the rest
#   hybrid     down with it -- which is exactly what happened when they shared
#              a step. `lanes: providers` still selects all four at once
#   llvm       the BLADE_LLVM lane: the llvm-vs-C++ stdout differential over
#              the corpus. Standalone only, deliberately: it spawns two native
#              compilers per file
#   llvm-suite NIGHTLY-ONLY. The corpus run on the LLVM lane ALONE, judged
#              against its own EXPECT pins rather than against the C++ lane --
#              one compiler per file, no g++ in the loop, and it reaches
#              categories the differential does not sweep. Programs the lane
#              refuses skip; nothing falls back to C++
#
# Never run here: `test cuda` (no usable nvcc host compiler on hosted
# runners), `test timing` and `test llvm-bench` (benchmarks are not pass/fail
# signal, and a shared runner is the wrong instrument), `test diff-oracle`
# (hours, and it needs the separate oracle build). The `interp` differential is
# available on demand via the workflow_dispatch input.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # `labeled` is what makes the `ci:full` opt-in below work on an already
    # open pull request; the other three are the defaults this would otherwise
    # get implicitly.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily, on master only (GitHub runs schedules on the default
    # branch). This is what makes a build-only default safe: a regression the
    # cheap gate cannot see still surfaces within a day rather than at release.
    #
    # The README's `nightly` badge reports THIS trigger's last run. The badge
    # URL keys on the workflow FILENAME plus `event=schedule`, so renaming this
    # file or dropping this trigger empties the badge rather than reddening it
    # -- a way for the badge to stop meaning anything without looking broken.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Which test lanes to run'
        type: choice
        default: all
        options: [all, none, cpp, providers, netcdf, zarr, csv, icechunk, provider-desugar, hybrid, llvm, llvm-suite]
      include-interp:
        description: 'Also run the interpreter/codegen differential (slow)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ------------------------------------------------------------------------
  # The default gate. Cheap enough to run on every push: no native toolchain
  # is installed or invoked.
  #
  # ON LINUX, deliberately. Nothing this job does is Windows-specific -- the
  # build is a plain net10.0 compile with no PackageReferences, and the goldens
  # are four in-process blocks that spawn no compiler and compare .ll text
  # carrying no target triple, no datalayout and no paths. Linux runners boot
  # faster, install the .NET 10 SDK faster (the Windows image may not ship it, so it
  # is a download either way), and bill at 1x where Windows bills at 2x.
  #
  # The Windows lanes do NOT depend on this job, so if the Linux path turns
  # out to have a wrinkle it cannot take the real coverage down with it -- and
  # reverting is one line.
  # ------------------------------------------------------------------------
  build:
    name: build + emitter goldens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Blade.fsproj is the one exe project: compiler, domain elaborators and
      # the whole test harness in a single binary. The oracles/ projects are
      # separate and only feed `test diff-oracle`, which CI does not run.
      - name: Build
        run: dotnet build Blade.fsproj -c Release

      # `llvm goldens` is the reserved word for the three toolchain-free blocks
      # -- compare rules, byte-pinned .ll emission, and the fact layer -- plus
      # the simplex-block agreement check. About 60 assertions in ~1.5s, and
      # not one of them spawns a compiler, which is exactly what a
      # run-on-every-push gate should be made of.
      # Invoked as `dotnet <dll>` rather than through the apphost: a
      # framework-dependent Blade.dll runs anywhere, where the apphost is
      # `Blade` here and `Blade.exe` on the lanes. The script does not care --
      # it just runs `& $Blade @BladeArgs`.
      - name: Byte-pinned emitter goldens
        shell: pwsh
        run: >
          ./.github/scripts/Invoke-BladeTest.ps1
          -Blade dotnet
          -Name 'llvm goldens'
          -BladeArgs 'bin/Release/net10.0/Blade.dll','test','llvm','goldens'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-build
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # Decide which heavy lanes this event asks for, and emit the matrix. Runs on
  # Linux because it is pure arithmetic over the event payload -- no checkout,
  # no toolchain, and Linux minutes are cheaper than Windows ones.
  # ------------------------------------------------------------------------
  plan:
    name: plan lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - id: pick
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          LANES: ${{ inputs.lanes }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # The lane table. One place; the workflow's `test` job is generic.
          $lanes = [ordered]@{
            cpp = @{
              title       = 'C++ back end'
              timeout     = 120
              verbs       = 'test --omp --mpi'
              # By far the longest lane -- it compiles thousands of corpus
              # programs with g++. Held back from the label and `lanes: all`
              # paths so a pull request opting in does not wait on it; the
              # nightly carries it, and `lanes: cpp` still runs it on demand.
              nightlyOnly = $true
            }
            # ONE LANE PER PROVIDER, not one lane running the provider verbs
            # in sequence. Each lane is its own job on its own runner, so a verb
            # that hangs -- and `test netcdf` has hung, on an HDF5 lock with no
            # timeout behind it -- costs its own lane and nothing else. As one
            # step they shared a fate: netcdf hung and zarr, csv and hybrid
            # never ran at all.
            #
            # The cost is per-lane fixed overhead (checkout, SDK, build,
            # toolchain, doctor) paid once per lane instead of once in total. It
            # buys failure isolation and one independent red/green signal per
            # provider, and the lanes run concurrently so wall-clock does not
            # suffer.
            netcdf = @{
              title       = 'Provider: NetCDF'
              timeout     = 45
              verbs       = 'test netcdf'
              nightlyOnly = $false
            }
            zarr = @{
              title       = 'Provider: Zarr'
              timeout     = 45
              verbs       = 'test zarr'
              nightlyOnly = $false
            }
            csv = @{
              title       = 'Provider: CSV'
              timeout     = 30
              verbs       = 'test csv'
              nightlyOnly = $false
            }
            # Icechunk writes its own fixture repos on the fly (IcechunkWrite)
            # and then compiles + runs several of them, so it is the most
            # expensive of the provider lanes; the timeout matches zarr's
            # rather than csv's for that reason.
            icechunk = @{
              title       = 'Provider: Icechunk'
              timeout     = 45
              verbs       = 'test icechunk'
              nightlyOnly = $false
            }
            # The checkout desugar alone: a pure in-process AST rewrite, no
            # store and no toolchain, ~1s. It also rides the DEFAULT suite
            # (tests/RunAll.fs), but the default suite only reaches CI through
            # the nightly-only `cpp` lane -- this entry is what lets a pull
            # request see the pass every compilation goes through, for the cost
            # of a build.
            'provider-desugar' = @{
              title       = 'Provider: icechunk checkout desugar'
              timeout     = 15
              verbs       = 'test provider-desugar'
              nightlyOnly = $false
            }
            hybrid = @{
              title       = 'Mixed parallelism (MPI + OpenMP)'
              timeout     = 45
              verbs       = 'test hybrid'
              nightlyOnly = $false
            }
            llvm = @{
              title       = 'LLVM back end (differential vs C++)'
              timeout     = 120
              verbs       = 'test llvm'
              nightlyOnly = $false
            }
            # The other half of the LLVM story, and a different question.
            # `llvm` above asks whether the two lanes AGREE, which needs both
            # compilers and is bounded by what the C++ oracle also compiles.
            # This one runs the corpus on the LLVM lane alone and judges it
            # against the corpus's own EXPECT pins -- no g++ in the loop, one
            # compiler per file, and it reaches categories the differential
            # does not sweep. Refusals skip; they are never quietly handed to
            # the C++ emitter.
            #
            # Nightly-only: it is a whole-corpus compile, the same order of
            # cost as the C++ suite it mirrors.
            'llvm-suite' = @{
              title       = 'Corpus on the LLVM back end'
              timeout     = 120
              verbs       = 'test --llvm-backend'
              nightlyOnly = $true
            }
          }
          $all = @($lanes.Keys)

          # Named groups, so splitting a lane does not cost the shorthand that
          # named it. `lanes: providers` still selects the provider set; it just
          # gets one job per provider now instead of one job in total.
          $groups = @{ providers = @('netcdf', 'zarr', 'csv', 'icechunk', 'provider-desugar', 'hybrid') }

          $selected = switch ($env:EVENT) {
            'schedule'          { $all }
            'workflow_dispatch' {
              switch ($env:LANES) {
                'all'   { $all }
                'none'  { @() }
                default {
                  if ($groups.ContainsKey($env:LANES)) { $groups[$env:LANES] }
                  else { @($env:LANES) }
                }
              }
            }
            'pull_request' {
              # Opting a single pull request in, without editing the workflow.
              if ($env:LABELS -and ($env:LABELS | ConvertFrom-Json) -contains 'ci:full') { $all } else { @() }
            }
            default { @() }
          }
          $selected = @($selected | Where-Object { $lanes.Contains($_) })

          # Nightly-only lanes are dropped from the BROAD opt-ins -- the
          # `ci:full` label and `lanes: all` -- but never from an explicit
          # single-lane request, and never from the nightly itself. Say what
          # was held back: a lane silently missing from a run the user asked
          # "everything" for is how coverage quietly stops existing.
          $broad = ($env:EVENT -eq 'pull_request') -or
                   ($env:EVENT -eq 'workflow_dispatch' -and $env:LANES -eq 'all')
          if ($broad) {
            $held = @($selected | Where-Object { $lanes[$_].nightlyOnly })
            if ($held.Count -gt 0) {
              Write-Host "held back (nightly-only, run the nightly or dispatch it by name): $($held -join ', ')"
            }
            $selected = @($selected | Where-Object { -not $lanes[$_].nightlyOnly })
          }

          $include = @($selected | ForEach-Object {
            [pscustomobject]@{
              lane    = $_
              title   = $lanes[$_].title
              timeout = $lanes[$_].timeout
              verbs   = $lanes[$_].verbs
            }
          })
          # Serialize ONE ELEMENT AT A TIME and assemble the array by hand.
          # ConvertTo-Json's array handling is the trap here: the pipeline form
          # collapses a one-element array to a bare object, and -InputObject
          # treats its argument as a single object, so -AsArray wraps an
          # already-array input a SECOND time and yields include:[[...]] --
          # which fails as "A sequence was not expected" only once GitHub tries
          # to expand the matrix, i.e. after the plan job has gone green. A
          # lone PSCustomObject has no such ambiguity.
          $matrix = '{"include":[' +
                    (($include | ForEach-Object { ConvertTo-Json -InputObject $_ -Depth 5 -Compress }) -join ',') +
                    ']}'

          # Prove the shape here rather than discovering it in `strategy`.
          $shape = $matrix | ConvertFrom-Json
          if (@($shape.include).Count -ne $include.Count) {
            throw "matrix shape is wrong: expected $($include.Count) include entries, JSON has $(@($shape.include).Count) -- $matrix"
          }
          foreach ($entry in @($shape.include)) {
            foreach ($key in 'lane', 'title', 'timeout', 'verbs') {
              if (-not $entry.PSObject.Properties[$key]) { throw "matrix entry is missing '$key': $matrix" }
            }
          }

          Write-Host "event=$($env:EVENT) -> lanes: $(if ($selected) { $selected -join ', ' } else { '(none -- build only)' })"
          Write-Host "matrix=$matrix"
          "matrix=$matrix" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "any=$(($include.Count -gt 0).ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  test:
    name: ${{ matrix.title }}
    # `plan` only, NOT `build`. The lanes compile their own Windows binary, so
    # the Linux gate is not on their critical path -- a wrinkle there must not
    # be able to cancel the nightly's real coverage.
    needs: [plan]
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      # The content-addressed executable cache Blade keeps between runs. Moving
      # it into the workspace is what lets actions/cache carry it across CI
      # runs; the key Blade computes internally already covers compiler
      # identity, link flags and source text, so a stale entry can only miss,
      # never lie.
      BLADE_EXE_CACHE: ${{ github.workspace }}\.blade-exe-cache

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Built here rather than downloaded from `build`: that job produces a
      # Linux apphost, and these lanes want Blade.exe. Two minutes against a
      # lane measured in tens of them.
      - name: Build
        run: dotnet build Blade.fsproj -c Release

      - name: Native toolchain
        uses: ./.github/actions/setup-blade-toolchain

      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.blade-exe-cache
          key: blade-exe-${{ matrix.lane }}-${{ github.sha }}
          restore-keys: |
            blade-exe-${{ matrix.lane }}-

      # Assert the environment BEFORE running anything, because a missing
      # dependency makes this harness SKIP rather than fail, and skips do not
      # affect the exit code -- a half-installed runner is otherwise a green
      # run that proved nothing. Every lane asserts the WHOLE toolchain, not
      # just its own slice: the claim being made is that the CI environment is
      # complete, and a lane-shaped assertion lets a dependency rot unnoticed
      # until the lane that needs it happens to change.
      #
      # `cuda` is the one row never required -- hosted runners have no usable
      # nvcc host compiler, which is why `test cuda` is not a lane here.
      - name: Assert the toolchain is complete
        shell: pwsh
        run: >
          .\.github\scripts\Assert-Toolchain.ps1
          -Blade .\bin\Release\net10.0\Blade.exe
          -Require gpp,llvm,blas,lapack,netcdf,mpi

      # Runs BEFORE the lane, so a lane that hangs cannot stop it reporting.
      # Never fails the job -- it answers a question, it does not judge one.
      - name: Diagnose netcdf process exit
        if: matrix.lane == 'netcdf'
        shell: pwsh
        continue-on-error: true
        run: .\.github\scripts\Diagnose-Netcdf.ps1

      - name: ${{ matrix.title }}
        shell: pwsh
        env:
          VERBS: ${{ matrix.verbs }}
        run: |
          $exe = '.\bin\Release\net10.0\Blade.exe'
          $failed = @()
          foreach ($verb in ($env:VERBS -split "`r?`n")) {
            if (-not $verb.Trim()) { continue }
            $bladeArgs = $verb.Trim() -split '\s+'
            .\.github\scripts\Invoke-BladeTest.ps1 -Blade $exe -Name "blade $($verb.Trim())" -BladeArgs $bladeArgs
            if ($LASTEXITCODE -ne 0) { $failed += $verb.Trim() }
          }
          if ($failed.Count -gt 0) { throw "red: $($failed -join '; ')" }

      # The interpreter and codegen are differential twins, so this gate is
      # what catches one drifting from the other -- it is just too slow to
      # attach to a lane by default.
      - name: Interpreter differential
        if: matrix.lane == 'cpp' && inputs.include-interp
        shell: pwsh
        run: >
          .\.github\scripts\Invoke-BladeTest.ps1
          -Blade .\bin\Release\net10.0\Blade.exe
          -Name 'interpreter differential'
          -BladeArgs 'test','--interp'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-${{ matrix.lane }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

      # The GENERATED SOURCES, when a provider lane goes red.
      #
      # A provider failure is nearly always about what the emitter baked into
      # the program -- extents folded from the store's metadata, above all --
      # and that is unreadable from a log line saying the program timed out.
      # The .cpp says it outright.
      #
      # Provider lanes only, and only on failure: `blade test netcdf` leaves a
      # handful of files in this directory, where the cpp lane leaves thousands
      # and would turn every red run into a several-hundred-megabyte upload.
      - uses: actions/upload-artifact@v6
        if: >-
          failure() && (matrix.lane == 'netcdf' || matrix.lane == 'zarr'
          || matrix.lane == 'csv' || matrix.lane == 'icechunk'
          || matrix.lane == 'hybrid')
        with:
          name: generated-${{ matrix.lane }}
          path: |
            generated_cpp_tests/**/*.cpp
            generated_cpp_tests/**/*.ll
          retention-days: 7
          if-no-files-found: ignore
